<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="icon" href="{% static 'images/bag1.png' %}">
    <title>Project Details</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'styles/project-detail.css' %}">
</head>
<body>
    {% block content %}
    
    {% include 'navbar.html' %}
    
    <div class="content">
        
            <section class="projects-list">
                    <div class="project-card">
                        <div class="project-details">
                            <h2>{{ project.projectName }}</h2>
                                <div class="tech-link">
                                    <p1><strong>Technology:</strong> {{ project.projectTechnology }}</p1>
                                    <a href="https://funza.onrender.com/">Project Link</a>
                                </div>
                            
                            <p>{{ project.projectDescription }}</p>
                        </div>
                    </div>
            </section>
        
    </div>

    {% endblock content %}
</body>
</html>
